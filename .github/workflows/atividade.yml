name: Atualiza cartão de atividade
on:
  schedule: [{cron: "17 6 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/atividade.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/atividade.svg
          git diff --cached --quiet || (git commit -m "Atualiza cartão de atividade" && git push)
