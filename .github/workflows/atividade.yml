name: Atualiza cartão de atividade
on:
  schedule: [{cron: "17 6 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gera o cartão (precisa do segredo PERFIL_TOKEN para contar contribuições privadas)
        run: |
          test -n "$GITHUB_TOKEN" || { echo "Falta o segredo PERFIL_TOKEN (token com read:user)"; exit 1; }
          python scripts/atividade.py
        env:
          GITHUB_TOKEN: ${{ secrets.PERFIL_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/atividade.svg
          git diff --cached --quiet || (git commit -m "Atualiza cartão de atividade" && git push)
